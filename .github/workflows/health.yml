name: Engine health check

# Real end-to-end check of the whole engine (site, old address, Gumroad, media for every scheduled
# post, Pinterest feed, recent posts on Instagram / Facebook / YouTube, token permissions).
# Posts nothing. Runs every morning before the 08:03 routine and on demand.
on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

permissions: { contents: read }

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check everything
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          META_TOKEN: ${{ secrets.META_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: python3 marketing/tools/healthcheck.py
